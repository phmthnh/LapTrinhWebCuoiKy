<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - SmartHome</title>

  <link rel="stylesheet" href="/style.css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body class="login-page-body">

  <!-- HEADER -->
  <header class="login-page-header">
    <div class="login-header-container">

      <div class="logo">
        <a href="/index.html">
          <span>SmartHome</span>
        </a>
      </div>

      <span class="header-page-title">Đăng nhập</span>

    </div>
  </header>

  <!-- MAIN -->
  <main class="login-main-content">

    <!-- LEFT -->
    <div class="login-banner">

      <div class="banner-content">

        <h1>Smart Living</h1>

        <p>
          Công nghệ hiện đại cho không gian sống tiện nghi hơn.
        </p>

        <div class="banner-icons">

          <div class="icon-box">
            <i class="fa-solid fa-house"></i>
            <span>Nhà thông minh</span>
          </div>

          <div class="icon-box">
            <i class="fa-solid fa-shield-halved"></i>
            <span>An toàn</span>
          </div>

          <div class="icon-box">
            <i class="fa-solid fa-wifi"></i>
            <span>Kết nối hiện đại</span>
          </div>

        </div>

      </div>

    </div>

    <!-- RIGHT -->
    <div class="login-form-area">

      <div class="shopee-login-card">

        <h2 class="form-title">Đăng nhập</h2>

        <form>

          <div class="shopee-input-group">
            <input
              type="text"
              placeholder="Email / Số điện thoại / Tên đăng nhập"
              required
            />
          </div>

          <div class="shopee-input-group">
            <input
              type="password"
              placeholder="Mật khẩu"
              required
            />
          </div>

          <button type="submit" class="shopee-btn-submit">
            ĐĂNG NHẬP
          </button>

          <div class="shopee-form-links">
            <a href="#">Quên mật khẩu</a>
            <a href="#" class="register-link">Đăng ký</a>
          </div>

          <div class="shopee-divider">
            <div class="line"></div>
            <span>HOẶC</span>
            <div class="line"></div>
          </div>

          <div class="social-login">

            <button type="button" class="social-btn">
              <i class="fa-brands fa-facebook-f"></i>
              Facebook
            </button>

            <button type="button" class="social-btn">
              <i class="fa-brands fa-google"></i>
              Google
            </button>

          </div>

        </form>

      </div>

    </div>

  </main>

</body>
</html>
